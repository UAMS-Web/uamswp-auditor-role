name: CI

# The checks this plugin runs. The lint and unit chain is the shared one,
# `UAMS-Web/uams-ci-workflows`, called by the `checks` job, so one definition serves every
# UAMS-Web repository and this plugin carries no copy that drifts. The call switches on the
# three jobs only a plugin runs (`floor-lint`, `download-archive`, `phpcs`), runs on Linux
# only, runs the Unit suite as `composer test:unit`, and leaves the chain's mutation jobs
# off. The chain's own header lists every input and its default.
#
# Three jobs stay here as plain jobs beside the call, because the chain does not cover them:
# `integration` (a MySQL service and a WordPress download), `mutate` (this plugin's own
# changed-files selection and run check, docs/DECISIONS.md) and `walk` (the screen walk).
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the
# call and the plain jobs, runs `if: always()`, and fails unless every needed job reports
# `success`: a `skipped` or `cancelled` job fails it. The call ends in a `Chain result` job
# that needs every job in the chain, so `checks` is `success` only when each of them
# succeeded. Adding a plain job here means adding it to the `needs:` list of `CI`; the
# `aggregate-needs` job in the chain fails the pull request when one is missing.
# Do not rename `CI`, and do not rename `checks` without changing `needs:` below.
#
# What this plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, and the Composer
# scripts `test:pint`, `test:refactor`, `stan`, `test:unit`, `test:phpcs` and the
# `scripts/lint-floor.php` and `scripts/check-download-archive.mjs` files.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.9.0
    with:
      linux-only: true
      mutate: false
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      phpcs: true
      pest-command: composer test:unit

  integration:
    name: Integration (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [single, multisite]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: uamswp_auditor_role_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_ABSPATH: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_MULTISITE: ${{ matrix.mode == 'multisite' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          integration: 'true'
      # The WordPress core copy the suite boots; the version is the one the sites run
      # (docs/DECISIONS.md), matching wp-phpunit in tests/Integration/composer.json.
      - name: Download WordPress
        env:
          WP_VERSION: '7.0.8'
        run: |
          mkdir -p "$WP_TESTS_ABSPATH"
          curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz -C "$WP_TESTS_ABSPATH" --strip-components=1
      - run: composer test:integration

  mutate:
    name: Mutation score (changed files, with PCOV)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # An explicit `bash` runs each step with `-eo pipefail`, so the run step's `| tee`
    # reports Pest's status, not tee's.
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2: on a pull request the checkout is GitHub's merge commit, whose first parent
      # is the base branch; on a push it is the pushed commit, whose first parent is the one
      # before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          coverage: pcov

      # Mutate only the PHP files under includes/ and tests/Walk/src/ that this change adds, changes or renames.
      # A change that touches none passes with the reason printed. A manual run mutates
      # everything `composer mutate` covers.
      - name: Select the files to mutate
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "A manual run: mutating everything composer mutate covers."
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^1 > /dev/null; then
            echo "::error::HEAD has no parent in this checkout, so the change cannot be read."
            exit 1
          fi
          # NUL-separated, so a name git would quote (non-ASCII, a tab) is read as it is.
          list=$(mktemp)
          git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- includes tests/Walk/src > "$list"
          files=()
          while IFS= read -r -d '' f; do
            [[ "$f" == *.php ]] || continue
            if [[ "$f" == *,* || "$f" == *$'\n'* ]]; then
              echo "::error::A changed path holds a comma or a newline, which --path cannot carry: $f"
              exit 1
            fi
            files+=("$f")
          done < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No PHP file under includes/ or tests/Walk/src/ is added or changed, so there is nothing to mutate."
            exit 0
          fi
          echo "Mutating ${#files[@]} changed file(s):"
          printf '%s\n' "${files[@]}"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "paths=$(IFS=,; echo "${files[*]}")" >> "$GITHUB_OUTPUT"

      # `composer mutate` passes --min=100, so Pest fails the step on any mutant not killed.
      # The later --path replaces the script's own. The log is kept for the check below.
      - name: Run mutation testing
        if: steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PATHS: ${{ steps.select.outputs.paths }}
        run: |
          if [ "$MODE" = "changed" ]; then
            composer mutate -- --ignore-min-score-on-zero-mutations --path="$PATHS" 2>&1 | tee mutate.log
          else
            composer mutate 2>&1 | tee mutate.log
          fi

      # Reads the log, not the exit status: fails on zero mutants and on any untested or
      # uncovered mutant. Runs even when the step above failed, so the log's own account is
      # printed. Changed files that produce no mutants with PCOV loaded hold no code a
      # mutator changes, which is a pass; zero mutants on a full run still fails.
      - name: Check the mutation run
        if: always() && steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
        run: |
          if [ "$MODE" = "changed" ] && php -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'; then
            php scripts/check-mutation-run.php mutate.log --allow-zero
          else
            php scripts/check-mutation-run.php mutate.log
          fi

  walk:
    name: Screen walk (multisite)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        shell: bash
    env:
      WP_ROOT: /tmp/walk-wordpress
      WP_VERSION: '7.0.8'
      WALK_ADMIN_PASSWORD: walk-admin-${{ github.run_id }}
      WALK_PASSWORD: walk-auditor-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp

      # A subdirectory multisite with two sites, WP-Cron off (a cron run a visit
      # starts writes as an anonymous request and would read as that visit's
      # write), the public plugin set network-active, and this plugin through
      # its must-use stub.
      - name: Build the multisite
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE walk'
          mkdir -p "$WP_ROOT" && cd "$WP_ROOT"
          wp core download --version="$WP_VERSION" --quiet
          wp config create --dbname=walk --dbuser=root --dbpass= --dbhost=127.0.0.1 --skip-check --extra-php <<'PHP'
          define('DISABLE_WP_CRON', true);
          PHP
          wp core multisite-install --url=http://localhost --title=Walk --admin_user=admin --admin_password="$WALK_ADMIN_PASSWORD" --admin_email=admin@example.test --skip-email
          wp site create --slug=two --title=Two --quiet
          # One at a time, so a plugin that will not install is named.
          for plugin in $(grep -v '^#' "$GITHUB_WORKSPACE/tests/Walk/plugins.txt"); do
            wp plugin install "$plugin" --activate-network || { echo "::error::Could not install $plugin"; exit 1; }
          done
          mkdir -p wp-content/mu-plugins
          git -C "$GITHUB_WORKSPACE" archive --worktree-attributes --format=tar --prefix=uamswp-auditor-role/ HEAD | tar -x -C wp-content/mu-plugins
          cp wp-content/mu-plugins/uamswp-auditor-role/loader/uamswp-auditor-role-loader.php wp-content/mu-plugins/
          wp user create walker walker@example.test --role=auditor --user_pass="$WALK_PASSWORD" --quiet
          wp --exec="define('UAMSWP_AUDITOR_ROLE_LOGINS', 'walker');" auditor sync-sites
          for url in $(wp site list --field=url); do wp option get blogname --url="$url" > /dev/null; done
          wp plugin list --status=must-use --fields=name,status

      - name: Serve it
        run: |
          sudo PHP_CLI_SERVER_WORKERS=4 "$(command -v php)" -S 127.0.0.1:80 -t "$WP_ROOT" "$GITHUB_WORKSPACE/tests/Walk/router.php" > /tmp/walk-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost/wp-login.php && break; sleep 1; done
          curl -fsS -o /dev/null -w 'wp-login.php: %{http_code}\n' http://localhost/wp-login.php
          curl -sS -o /dev/null -w 'two/wp-admin/: %{http_code}\n' http://localhost/two/wp-admin/

      - name: Walk every screen and AJAX action as an Auditor
        run: |
          php tests/Walk/walk.php --wp-root="$WP_ROOT" --admin=admin --auditor=walker --password-env=WALK_PASSWORD \
            --db-host=127.0.0.1 --db-user=root --db-name=walk --report=walk.md --settle-ms=100
          cat walk.md >> "$GITHUB_STEP_SUMMARY"

      # Every target with its result, for a run searched for one screen; the job
      # summary above carries the same list.
      - name: Keep the walk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-walk-report
          path: walk.md
          if-no-files-found: warn

      # The control: a must-use plugin that writes through its own connection
      # on every admin request by an Auditor. The walk must fail and name it.
      - name: A planted write fails the walk
        run: |
          cp tests/Walk/fixtures/planted-write.php "$WP_ROOT/wp-content/mu-plugins/"
          set +e
          php tests/Walk/walk.php --wp-root="$WP_ROOT" --admin=admin --auditor=walker --password-env=WALK_PASSWORD \
            --db-host=127.0.0.1 --db-user=root --db-name=walk --report=planted.md --settle-ms=100 --limit=5
          status=$?
          set -e
          rm "$WP_ROOT/wp-content/mu-plugins/planted-write.php"
          cat planted.md
          if [ "$status" -ne 1 ] || ! grep -q '_options` | row |' planted.md; then
            echo "::error::The planted write did not fail the walk (exit $status)."
            exit 1
          fi
          echo "The walk failed on the planted write, as it must."

      - name: Server log
        if: always()
        run: tail -n 50 /tmp/walk-server.log || true

  # The one check a ruleset requires from this workflow.
  ci:
    name: CI
    needs: [checks, integration, mutate, walk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
